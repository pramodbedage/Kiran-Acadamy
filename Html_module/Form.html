<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">

        <fieldset>
            <legend>Student Deatils</legend>
            <label for="name">Frist Name: <input id="name" type="text" placeholder="Enter Your First Name"
                    required></label><br><br>
            <label for="lastname">Last Name: <input id="lastname" type="text" placeholder="Enter Your Last Name"
                    required></label><br><br>

            <label for="City">City: <select name="City" id="City" required>
                    <option value="Pune">Pune</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Nagpur">Nagpur</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Bangalore">Bangalore</option>
                </select></label><br><br>

            <label for="gender">Gender:
                <input type="radio" name="gender" id="male">Male
                <input type="radio" name="gender" id="female">Female
                <input type="radio" name="gender" id="other">Other
            </label><br><br>

            <label for="DOB">Date of Birth: <input type="date" name="DOB" id="DOB"></label><br><br>

            <label for="time">Time: <input type="time" name="time" id="time"></label><br><br>

            <label for="number">Phone Number: <input type="number" name="number" id="number"
                    placeholder="Enter Your Phone Number" required></label><br><br>

            <label for="email">Email: <input type="email" name="email" id="email" placeholder="Enter Your Email"
                    required></label><br><br>

            <label for="address">Address: <input type="text" name="address" id="address"
                    placeholder="Enter Your Address" required></label><br><br>

            <button type="submit">Submit</button>

            <button type="reset">Reset</button>

        </fieldset>

    </form>
</body>

</html>
