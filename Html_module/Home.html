<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Complete HTML Table Example</title>
</head>

<body>

    <table id="report" class="marks-table" title="Student marks table" border="1" cellpadding="8">

        <caption>Student Report Card 2026</caption>

        <colgroup>
            <col span="2"> <!-- columns 1 and 2 -->
            <col span="2"> <!-- columns 3 and 4 -->
        </colgroup>

        <thead>
            <tr>
                <th id="h-name" scope="col" abbr="Nm">Name</th>
                <th id="h-subject" scope="col">Subject</th>
                <th id="h-marks" scope="col">Marks</th>
                <th id="h-grade" scope="col">Grade</th>
            </tr>
        </thead>

        <tbody id="class-a">
            <tr>
                <th scope="row" rowspan="2" headers="h-name">Amit</th>
                <td headers="h-subject">Maths</td>
                <td headers="h-marks">85</td>
                <td headers="h-grade">A</td>
            </tr>
            <tr>
                <td headers="h-subject">Science</td>
                <td headers="h-marks">90</td>
                <td headers="h-grade">A+</td>
            </tr>
            <tr>
                <th scope="row" headers="h-name">Priya</th>
                <td headers="h-subject">Maths</td>
                <td headers="h-marks">92</td>
                <td headers="h-grade">A+</td>
            </tr>
        </tbody>

        <tbody id="class-b">
            <tr>
                <th scope="row" headers="h-name">Rahul</th>
                <td headers="h-subject">Maths</td>
                <td headers="h-marks">78</td>
                <td headers="h-grade">B</td>
            </tr>
            <tr>
                <td colspan="2" data-note="nested">
                    <!-- nested table -->
                    <table border="1">
                        <tr>
                            <td>Remark</td>
                            <td>Needs practice</td>
                        </tr>
                    </table>
                </td>
                <td colspan="2" lang="en" title="Attendance">Attendance: 90%</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total Students</td>
                <td>3</td>
            </tr>
        </tfoot>

    </table>

</body>

</html>
